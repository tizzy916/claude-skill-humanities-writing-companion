name: 🐛 Bug Report · Skill 出错
description: "The skill behaves in a way that doesn't match SKILL.md · skill 在某个场景下行为不符合 SKILL.md 描述"
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please provide a minimal reproducible scenario if you can — ideally the prompt that triggers the skill plus the output the skill actually produced.

        感谢汇报问题。请尽量提供可复现的最小场景——最好是一段触发 skill 的 prompt + skill 实际给出的输出。

  - type: textarea
    id: trigger
    attributes:
      label: "Trigger scenario · 触发场景"
      description: "What did you say to put the skill into this state? · 你说了什么让 skill 进入这个状态？"
      placeholder: |
        e.g., I said to Claude "take a look at this chapter for me" and then pasted in a chunk of markdown.
        例如：我对 Claude 说"帮我看看这一章"，然后贴入了一段 markdown。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior · 预期行为"
      description: "Based on which section of SKILL.md did you expect a certain behavior? · 根据 SKILL.md 的哪一节，你预期 skill 会怎么做？"
      placeholder: |
        Mode B in SKILL.md's "working modes" section should produce a four-level feedback report: blocker / major / minor / question.
        SKILL.md "工作模式" 节的"模式 B"应该生成 blocker/major/minor/question 四级反馈报告。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior · 实际行为"
      description: "What did the skill actually do? · skill 实际怎么做了？"
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: "Claude model · Claude 模型"
      options:
        - Claude 4.5 Sonnet
        - Claude 4.5 Haiku
        - "Claude Opus 4.7 (1M context)"
        - Claude 4.7 Sonnet
        - "Other — please note below · 其他（请在备注中说明）"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: "Entry point · 接入方式"
      options:
        - Claude Code CLI
        - Claude Agent SDK
        - "Claude.ai web / mobile · Claude.ai 网页 / 手机端"
        - "Self-built client · 自建客户端"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "Other · 其他"
      description: "Any context, screenshots, or links to relevant files · 任何上下文、截图、相关文件的链接"
